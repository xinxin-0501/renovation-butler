<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>装修管家工作台</title>
<style>
  :root{
    --primary:#FF7A45;
    --primary-soft:#FFF1EA;
    --bg:#F4F5F7;
    --card:#FFFFFF;
    --ink:#2B2B2B;
    --ink-2:#8A8F99;
    --line:#EEF0F3;
    --green:#34C759;
    --green-soft:#E9F9EE;
    --red:#FF3B30;
    --red-soft:#FFECEB;
    --blue:#2DA3F8;
    --blue-soft:#E8F4FF;
    --amber:#FF9F0A;
    --radius:16px;
    --shadow:0 6px 20px rgba(20,30,50,.06);
    font-size:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);
    display:flex;justify-content:center;
  }
  /* 手机外壳：桌面端居中显示，移动端铺满 */
  .app{
    width:100%;max-width:430px;min-height:100vh;
    background:var(--bg);position:relative;
    display:flex;flex-direction:column;
    box-shadow:0 0 40px rgba(0,0,0,.05);
  }
  header{
    position:sticky;top:0;z-index:20;
    background:linear-gradient(135deg,#FF8A5B,#FF6B3D);
    color:#fff;padding:18px 18px 16px;
    border-radius:0 0 22px 22px;
  }
  header .title{font-size:20px;font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:8px;}
  header .sub{font-size:12px;opacity:.9;margin-top:4px;}
  header .reset{
    position:absolute;right:16px;top:18px;font-size:12px;
    background:rgba(255,255,255,.22);color:#fff;border:none;
    padding:6px 12px;border-radius:20px;cursor:pointer;
  }
  .scroll{flex:1;overflow-y:auto;padding:16px 14px 90px;-webkit-overflow-scrolling:touch;}

  /* 通用卡片 */
  .card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px;}
  .card h3{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:7px;}
  .card h3 .dot{width:8px;height:8px;border-radius:50%;background:var(--primary);}

  /* 总览 hero */
  .hero{
    background:linear-gradient(135deg,#FFF6F1,#FFEFE8);
    border:1px solid #FFE0D2;
  }
  .hero .stage-name{font-size:17px;font-weight:800;color:var(--primary);margin-top:2px;}
  .ring-wrap{display:flex;align-items:center;gap:16px;}
  .ring{position:relative;width:84px;height:84px;flex:0 0 auto;}
  .ring svg{transform:rotate(-90deg);}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--primary);}
  .hero .meta{font-size:13px;color:var(--ink-2);line-height:1.7;}
  .hero .meta b{color:var(--ink);}

  /* 统计格 */
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px;}
  .stat{background:var(--card);border-radius:14px;padding:12px 8px;text-align:center;box-shadow:var(--shadow);}
  .stat .num{font-size:20px;font-weight:800;}
  .stat .lbl{font-size:11px;color:var(--ink-2);margin-top:3px;}
  .stat.warn .num{color:var(--red);}
  .stat.ok .num{color:var(--green);}

  /* 下一步 */
  .next-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px;}
  .next-item:last-child{border-bottom:none;}
  .next-item .box{width:18px;height:18px;border-radius:5px;border:2px solid #D7DBE0;flex:0 0 auto;margin-top:1px;}
  .next-item.done .txt{color:var(--ink-2);text-decoration:line-through;}

  /* 进度条 */
  .bar{height:9px;background:#F0F2F5;border-radius:6px;overflow:hidden;}
  .bar > i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#FF9A5B,#FF6B3D);}
  .bar.over > i{background:linear-gradient(90deg,#FF6B6B,#FF3B30);}

  /* 流程阶段 */
  .stage-card .head{display:flex;align-items:center;gap:10px;cursor:pointer;}
  .stage-card .idx{
    width:30px;height:30px;border-radius:9px;flex:0 0 auto;
    background:var(--primary-soft);color:var(--primary);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;
  }
  .stage-card.done .idx{background:var(--green);color:#fff;}
  .stage-card .name{font-size:15px;font-weight:700;flex:1;}
  .stage-card .prog{font-size:12px;color:var(--ink-2);}
  .stage-card .chev{transition:transform .25s;color:var(--ink-2);}
  .stage-card.open .chev{transform:rotate(180deg);}
  .stage-body{display:none;margin-top:12px;}
  .stage-card.open .stage-body{display:block;}
  .task{display:flex;align-items:flex-start;gap:10px;padding:8px 0;font-size:14px;cursor:pointer;}
  .task .box{width:19px;height:19px;border-radius:6px;border:2px solid #D7DBE0;flex:0 0 auto;margin-top:1px;display:flex;align-items:center;justify-content:center;}
  .task.done .box{background:var(--green);border-color:var(--green);}
  .task.done .box svg{display:block;}
  .task.done .txt{color:var(--ink-2);text-decoration:line-through;}
  .task .txt{line-height:1.5;flex:1;min-width:0;}
  /* 阶段耗时 / 找谁做（v3.0） */
  .stage-meta{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;padding:10px 12px;background:var(--blue-soft);border-radius:12px;}
  .meta-item{display:flex;align-items:flex-start;gap:8px;font-size:13px;line-height:1.5;}
  .meta-item .ic{flex:0 0 auto;font-size:15px;line-height:1.2;}
  .meta-item b{color:var(--ink);flex:0 0 auto;min-width:64px;}
  .meta-item span.v{color:var(--ink-2);flex:1;min-width:0;}
  /* 顺序时间轴（v3.0） */
  .tl-wrap{margin-bottom:14px;}
  .tl-title{font-size:13px;font-weight:700;color:var(--ink-2);margin:0 0 8px 2px;display:flex;align-items:center;gap:6px;}
  .tl-scroll{display:flex;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px;}
  .tl-node{flex:0 0 auto;min-width:78px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px;text-align:center;}
  .tl-node.cur{border-color:var(--primary);background:var(--primary-soft);}
  .tl-node.done{opacity:.55;}
  .tl-idx{width:22px;height:22px;border-radius:50%;background:var(--primary);color:#fff;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-bottom:4px;}
  .tl-node.done .tl-idx{background:var(--green);}
  .tl-name{font-size:13px;font-weight:700;line-height:1.2;}
  .tl-dur{font-size:11px;color:var(--ink-2);margin-top:3px;line-height:1.3;}
  .tl-arrow{flex:0 0 auto;align-self:center;color:var(--ink-2);font-size:14px;padding:0 2px;}
  /* 全屋设计 v2.8 */
  .up-box{display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px dashed var(--line);border-radius:12px;padding:16px 10px;font-size:13px;color:var(--ink-2);cursor:pointer;background:#FAFBFC}
  .up-box:active{background:var(--primary-soft)}
  .up-hint{font-size:12px;color:var(--ink-2);margin:2px 0 10px}
  .fd-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
  .fd-label{flex:1.1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#FAFBFC}
  .fd-val{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;text-align:right}
  .fd-x{flex:none;width:30px;height:30px;border:none;background:#FEECEC;color:#E5484D;border-radius:9px;font-size:16px;cursor:pointer;line-height:1}
  .room-list{display:flex;flex-direction:column;gap:8px}
  .room-card{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;background:#fff}
  .room-card:active{background:var(--primary-soft)}
  .room-info{flex:1;min-width:0}
  .room-name{font-weight:700;font-size:15px}
  .room-meta{font-size:11px;color:var(--ink-2);margin-top:2px;min-height:13px}
  .room-badge{flex:none;border:1px solid var(--amber);background:#FFF7E8;color:#B8860B;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
  .room-badge.ok{border-color:var(--green);background:#EAF7EF;color:#1F8A4C}
  .room-badge.big{font-size:13px;padding:6px 14px}
  .room-more{flex:none;border:none;background:none;color:var(--ink-2);font-size:16px;letter-spacing:1px;cursor:pointer;padding:4px}
  .note-ta{width:100%;min-height:130px;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:14px;resize:vertical;box-sizing:border-box}
  #sketchCv{width:100%;border:1px solid var(--line);border-radius:12px;touch-action:none;background:#fff;display:block}
  .sk-tools{margin-top:10px}
  .sk-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .sk-lb{font-size:12px;color:var(--ink-2)}
  .sk-dot{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
  .sk-dot.on{box-shadow:0 0 0 2.5px var(--primary)}
  .sk-dot.c1{background:#8B6F47}.sk-dot.c2{background:#222}.sk-dot.c3{background:#C0392B}.sk-dot.c4{background:#2E5AAC}.sk-dot.c5{background:#2E8B57}
  .sk-btn{border:1px solid var(--line);background:#FBFCFD;border-radius:10px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
  .sk-btn.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:700}
  /* 案例参考 v2.5 */
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:7px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--ink);cursor:pointer;user-select:none}
  .chip.on{background:var(--orange,#FF7A45);border-color:var(--orange,#FF7A45);color:#fff}
  .chip i{font-style:normal;opacity:.55;font-size:11px;padding-left:2px}
  .chip.add{border-style:dashed;color:var(--ink-2)}
  .case-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ph{position:relative;border-radius:12px;overflow:hidden;background:#f6f1e7;aspect-ratio:4/5}
  .ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
  .ph-tag{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.55));color:#fff;font-size:11px;pointer-events:none}
  .ph-ops{position:absolute;top:6px;right:6px;display:flex;gap:5px}
  .ph-ops button{width:27px;height:27px;border:none;border-radius:50%;background:rgba(255,255,255,.92);font-size:13px;cursor:pointer;line-height:1}
  .case-empty{border:2px dashed var(--line);border-radius:14px;padding:28px 12px;text-align:center;color:var(--ink-2);cursor:pointer}
  .task .edit{margin-left:10px;flex:0 0 auto;color:var(--ink-2);font-size:16px;cursor:pointer;padding:2px 4px;border-radius:8px;}
  .task .edit:active{background:#F0F2F5;}
  .prep-note{font-size:12px;color:var(--ink-2);margin-top:5px;background:#F7F8FA;padding:6px 9px;border-radius:8px;line-height:1.5;}
  .prep-photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px;}
  .prep-photos img{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;}
  .gt{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:8px;}
  .guide{margin-top:10px;background:var(--primary-soft);border-radius:12px;padding:12px;}
  .guide .gt{font-size:13px;font-weight:700;color:var(--primary);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .guide li{font-size:13px;color:#6b6f76;line-height:1.6;margin-bottom:5px;}

  /* 预算 */
  .budget-total{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px;}
  .budget-total .big{font-size:24px;font-weight:800;}
  .budget-total .big small{font-size:13px;color:var(--ink-2);font-weight:500;}
  .budget-total .tag{font-size:12px;padding:4px 10px;border-radius:20px;font-weight:700;}
  .tag.ok{background:var(--green-soft);color:var(--green);}
  .tag.over{background:var(--red-soft);color:var(--red);}
  .cat{margin-top:14px;}
  .cat .top{display:flex;justify-content:space-between;align-items:center;font-size:14px;margin-bottom:6px;}
  .cat .top .nm{font-weight:700;display:flex;align-items:center;gap:7px;}
  .cat .top .amt{color:var(--ink-2);font-size:13px;}
  .cat .top .amt b{color:var(--ink);font-weight:700;}
  .cat .edit-budget{font-size:12px;color:var(--blue);cursor:pointer;margin-left:6px;}
  .cat .alert{font-size:12px;color:var(--red);margin-top:6px;display:none;}
  .cat.over .alert{display:block;}
  .cat.over .bar > i{background:linear-gradient(90deg,#FF6B6B,#FF3B30);}
  .swatch{width:10px;height:10px;border-radius:3px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--primary);color:#fff;border:none;border-radius:12px;
    padding:11px 16px;font-size:14px;font-weight:700;cursor:pointer;width:100%;
  }
  .btn.ghost{background:var(--primary-soft);color:var(--primary);}

  /* 待办 */
  .todo{display:flex;align-items:flex-start;gap:10px;padding:12px;background:var(--bg);border-radius:12px;margin-bottom:10px;}
  .todo .box{width:20px;height:20px;border-radius:6px;border:2px solid #D7DBE0;flex:0 0 auto;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .todo.done .box{background:var(--green);border-color:var(--green);}
  .todo.done .tt{text-decoration:line-through;color:var(--ink-2);}
  .todo .body{flex:1;min-width:0;}
  .todo .tt{font-size:14px;font-weight:600;line-height:1.4;}
  .todo .meta{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap;}
  .pill{font-size:11px;padding:3px 9px;border-radius:20px;font-weight:700;}
  .pill.high{background:var(--red-soft);color:var(--red);}
  .pill.mid{background:var(--amber);color:#fff;}
  .pill.low{background:#EDEFF2;color:var(--ink-2);}
  .pill.date{background:var(--blue-soft);color:var(--blue);}
  .pill.date.over{background:var(--red-soft);color:var(--red);}
  .todo .del{color:var(--ink-2);font-size:18px;cursor:pointer;padding:0 4px;flex:0 0 auto;}
  .empty{text-align:center;color:var(--ink-2);font-size:13px;padding:26px 0;}

  /* 底部导航 */
  nav{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:430px;
    background:#fff;border-top:1px solid var(--line);
    display:flex;z-index:30;padding:6px 0 calc(6px + env(safe-area-inset-bottom));
  }
  nav .tab{flex:1;text-align:center;font-size:11px;color:var(--ink-2);cursor:pointer;padding:4px 0;}
  nav .tab svg{display:block;margin:0 auto 3px;}
  nav .tab.active{color:var(--primary);font-weight:700;}
  nav .tab .badge{position:relative;}
  nav .tab .badge::after{
    content:attr(data-b);position:absolute;top:-4px;right:calc(50% - 22px);
    background:var(--red);color:#fff;font-size:9px;min-width:15px;height:15px;
    border-radius:8px;padding:0 3px;display:flex;align-items:center;justify-content:center;font-weight:700;
  }

  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:none;align-items:flex-end;justify-content:center;}
  .mask.show{display:flex;}
  .sheet{
    background:#fff;width:100%;max-width:430px;border-radius:22px 22px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease;
  }
  @keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:translateY(0);opacity:1}}
  .sheet h4{margin:0 0 16px;font-size:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--ink-2);margin-bottom:6px;}
  .field input,.field select,.field textarea{
    width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px;font-family:inherit;background:#FBFCFD;color:var(--ink);
  }
  .field textarea{resize:none;height:64px;}
  .seg{display:flex;gap:8px;}
  .seg button{flex:1;border:1px solid var(--line);background:#FBFCFD;border-radius:12px;padding:10px;font-size:14px;cursor:pointer;color:var(--ink-2);}
  .seg button.on{background:var(--primary-soft);border-color:var(--primary);color:var(--primary);font-weight:700;}
  .sheet .row{display:flex;gap:10px;margin-top:6px;}
  .sheet .row .btn{flex:1;}
  .sheet .row .btn.cancel{background:#F0F2F5;color:var(--ink-2);}
  .center{text-align:center;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">🏠 装修管家工作台</div>
    <div class="sub">从验房到入住，一站式装修管家 · <b id="verTag">v3.5</b>（免费 Gemini 视觉找问题 + 语音播报整改清单 + 装修巡检 + 比价平台直达 + 9阶段耗时参考 + 顺序时间轴 + 找谁做 + 自购材料清单 + 合同范本 + 案例 + 全屋设计）</div>
    <button class="reset" onclick="resetAll()">重置</button>
  </header>

  <div class="scroll" id="view"></div>

  <nav id="nav">
    <div class="tab active" data-t="overview" onclick="switchTab('overview')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      总览
    </div>
    <div class="tab" data-t="process" onclick="switchTab('process')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3.5" cy="6" r="1.6"/><circle cx="3.5" cy="12" r="1.6"/><circle cx="3.5" cy="18" r="1.6"/></svg>
      流程
    </div>
    <div class="tab" data-t="budget" onclick="switchTab('budget')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/><circle cx="17" cy="14.5" r="1.3" fill="currentColor" stroke="none"/></svg>
      预算
    </div>
    <div class="tab" data-t="todo" onclick="switchTab('todo')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3 8-8"/><path d="M20 12v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
      待办
    </div>
    <div class="tab" data-t="price" onclick="switchTab('price')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.83z"/><circle cx="7" cy="7" r="1.5"/></svg>
      比价
    </div>
    <div class="tab" data-t="cases" onclick="switchTab('cases')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-4.5-4.5L7 20"/></svg>
      案例
    </div>
    <div class="tab" data-t="design" onclick="switchTab('design')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 21h20"/><path d="M4 21V8l8-5 8 5v13"/><path d="M9 21v-6h6v6"/><path d="M9 11h.01M15 11h.01"/></svg>
      设计
    </div>
  </nav>
</div>

<!-- 弹窗 -->
<div class="mask" id="mask" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet"></div>
</div>

<script>
/* ============ 初始数据 ============ */
const STORAGE = 'renovation_butler_v1';

function inspAll(){
  const base = inspFlat().map(it=>({id:it.id,text:it.text,cat:it.cat,fix:it.fix,ai:false}));
  const ai = Object.keys(S.inspect.issues).filter(k=>S.inspect.issues[k]&&S.inspect.issues[k].ai).map(k=>{
    const o=S.inspect.issues[k];
    return {id:k,text:o.aiText||'(AI 发现)',cat:o.aiCat||'AI 发现',fix:o.aiFix||'',ai:true};
  });
  return base.concat(ai);
}

let S = load();
let AI_CFG = loadAICfg();
function loadAICfg(){ try{ return JSON.parse(localStorage.getItem('renovation_ai_cfg'))||{autoAnalyze:true,json:true}; }catch(e){ return {autoAnalyze:true,json:true}; } }
function saveAICfg(){ try{ localStorage.setItem('renovation_ai_cfg', JSON.stringify(AI_CFG)); }catch(e){} }
function load(){
  const s = seed();
  try{
    const d = JSON.parse(localStorage.getItem(STORAGE));
    if(d && d.stages){
      const seedStages = seed().stages;
      s.stages = d.stages.map(us=>{
        const ns = seedStages.find(x=>x.id===us.id);
        const have = new Set((us.tasks||[]).map(t=>t.text));
        const merged = (us.tasks||[]).map(t=>({...t}));
        if(ns) ns.tasks.forEach(t=>{ if(!have.has(t.text)) merged.push({id:uid(),text:t.text,done:false}); });
        return {...us, tasks: merged,
          dur: (us.dur!==undefined?us.dur:(ns?ns.dur:'')),
          who: (us.who!==undefined?us.who:(ns?ns.who:'')) };
      });
      s.budget = d.budget;
      s.todos  = d.todos;
      if(d.prep) s.prep = d.prep;   // 兼容旧数据，不覆盖用户已有内容
      if(d.purchases) s.purchases = d.purchases;  // 比价数据兼容（v2.3）
      if(d.cases) s.cases = d.cases;              // 案例参考兼容（v2.5）
      if(d.matDone) s.matDone = d.matDone;        // 阶段材料勾选兼容（v2.6）
      if(d.design) s.design = d.design;           // 全屋设计兼容（v2.8）
      if(d.inspect) s.inspect = d.inspect;        // 巡检自查兼容（v3.2）
      if(s.inspect && !s.inspect.photos) s.inspect.photos=[];
      if(s.inspect && !s.inspect.issues) s.inspect.issues={};
      return s;
    }
  }catch(e){}
  save(s); return s;
}
function save(s){ localStorage.setItem(STORAGE, JSON.stringify(s||S)); }

/* ============ 工具 ============ */
const fmt = n => '¥' + Math.round(n).toLocaleString('zh-CN');
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function today(){ const d=new Date(); return d.toISOString().slice(0,10); }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* 统计 */
function stats(){
  let total=0,done=0;
  S.stages.forEach(s=>s.tasks.forEach(t=>{total++; if(t.done)done++;}));
  const cur = S.stages.find(s=>!s.tasks.every(t=>t.done)) || S.stages[S.stages.length-1];
  let bTotal=0,bSpent=0; S.budget.forEach(b=>{bTotal+=b.budget;bSpent+=b.spent;});
  const pend = S.todos.filter(t=>!t.done);
  const overdue = pend.filter(t=>t.deadline && t.deadline<today());
  return {total,done,cur,bTotal,bSpent,pend,overdue,pendN:pend.length};
}

let curTab='overview';
function switchTab(t){
  curTab=t;
  document.querySelectorAll('#nav .tab').forEach(el=>el.classList.toggle('active',el.dataset.t===t));
  render();
}
function render(){
  const v=document.getElementById('view');
  if(curTab==='overview') v.innerHTML=renderOverview();
  else if(curTab==='process') v.innerHTML=renderProcess();
  else if(curTab==='budget') v.innerHTML=renderBudget();
  else if(curTab==='todo') v.innerHTML=renderTodo();
  else if(curTab==='cases') v.innerHTML=renderCases();
  else if(curTab==='design') v.innerHTML=renderDesign();
  else if(curTab==='price') v.innerHTML=renderPrice();
  // 手绘草图：渲染后初始化画布
  if(curTab==='design' && S.design.view!=='main' && S.design.roomTab==='sketch') setTimeout(()=>initSketch(S.design.view),0);
}

  <div class="stats">
    <div class="stat ${over?'warn':'ok'}"><div class="num">${bPct.toFixed(0)}%</div><div class="lbl">预算使用</div></div>
    <div class="stat"><div class="num">${st.pendN}</div><div class="lbl">待办事项</div></div>
    <div class="stat ${st.overdue.length?'warn':'ok'}"><div class="num">${st.overdue.length}</div><div class="lbl">已逾期</div></div>

    <div class="budget-total">

    </div>

      <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span>📋 办证手续</span><span style="color:var(--ink-2)">${pd}/${prepDocs.length}</span></div>

function speakInspect(){
  if(!('speechSynthesis' in window)){ alert('当前浏览器不支持语音播报，请用手机系统浏览器（Safari / Chrome）打开本页面。'); return; }
  if(window.speechSynthesis.speaking){ window.speechSynthesis.cancel(); return; }
  const open=inspAll().filter(it=>S.inspect.issues[it.id]&&S.inspect.issues[it.id].on&&!S.inspect.issues[it.id].fixed);
  if(!open.length){ alert('还没有待播报的整改项，先上传照片用 🤖 分析，或点「🔍 对照清单自查」勾选你照片里发现的问题。'); return; }
  window.speechSynthesis.cancel();
  const sevMap={high:'必须改',mid:'建议改',low:'可暂缓'};
  let txt='装修整改清单，共'+open.length+'项。';
  open.forEach((it,i)=>{ const o=S.inspect.issues[it.id]; txt+='第'+(i+1)+'项，'+(sevMap[o.sev]||'')+'，'+it.text+'，位于'+it.cat+'。改正方法：'+it.fix+'。'; });
  const u=new SpeechSynthesisUtterance(txt);
  u.lang='zh-CN'; u.rate=1; u.pitch=1;

  window.speechSynthesis.speak(u);
}

async function callVision(dataUrl){
  if(AI_CFG.provider==='gemini') return callVisionGemini(dataUrl);
  const cfg=AI_CFG;
  const base=(cfg.baseUrl||'').replace(/\/$/,'');
  const sys='你是资深装修监理，擅长从现场照片发现施工质量缺陷（空鼓、裂缝、起皮、不平整、阴阳角不顺直、美缝脱落、防水不到位、收口不齐、成品划伤等）。请只输出 JSON，不要多余文字。格式：{"issues":[{"cat":"部位","issue":"简短描述问题","sev":"high|mid|low","fix":"如何改正的简要方法"}]}。high=必须改，mid=建议改，low=可暂缓。若照片看不出明显问题，返回 {"issues":[]}。';
  const body={ model:cfg.model, temperature:0.3, messages:[
    {role:'system',content:sys},
    {role:'user',content:[ {type:'text',text:'请分析这张装修现场照片，列出没做好的地方及改正方法。'}, {type:'image_url',image_url:{url:dataUrl}} ]}
  ]};
  if(cfg.json!==false) body.response_format={type:'json_object'};
  const resp=await fetch(base+'/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},body:JSON.stringify(body)});
  if(!resp.ok){ let t=''; try{ t=await resp.text(); }catch(e){} return {error:'HTTP '+resp.status+' '+(t.slice(0,140))}; }
  const j=await resp.json();
  const content=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';
  return parseVision(content);
}
// Gemini（谷歌免费额度）：接口格式与 OpenAI 不同，单独实现；在免费额度内不收费
async function callVisionGemini(dataUrl){
  const cfg=AI_CFG;
  const model=cfg.model||'gemini-2.0-flash';
  const sys='你是资深装修监理，擅长从现场照片发现施工质量缺陷（空鼓、裂缝、起皮、不平整、阴阳角不顺直、美缝脱落、防水不到位、收口不齐、成品划伤等）。请只输出 JSON。格式：{"issues":[{"cat":"部位","issue":"简短描述问题","sev":"high|mid|low","fix":"如何改正的简要方法"}]}。high=必须改，mid=建议改，low=可暂缓。若照片看不出明显问题，返回 {"issues":[]}。';
  const b64=(dataUrl.split(',')[1]||dataUrl);
  const body={
    contents:[{parts:[
      {text: sys+' 请分析这张装修现场照片，列出没做好的地方及改正方法。'},
      {inlineData:{mimeType:'image/jpeg', data:b64}}
    ]}],
    generationConfig:{temperature:0.3, responseMimeType:'application/json'}
  };
  const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(cfg.key);
  const resp=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!resp.ok){ let t=''; try{ t=await resp.text(); }catch(e){} return {error:'HTTP '+resp.status+' '+(t.slice(0,160))}; }
  const j=await resp.json();
  const txt=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts&&j.candidates[0].content.parts[0]&&j.candidates[0].content.parts[0].text)||'';
  return parseVision(txt);
}
function parseVision(content){
  try{ const o=JSON.parse(content); if(o&&Array.isArray(o.issues)) return {issues:o.issues}; if(Array.isArray(o)) return {issues:o}; }catch(e){}
  const m=content.match(/\{[\s\S]*\}/);
  if(m){ try{ const o=JSON.parse(m[0]); if(o&&Array.isArray(o.issues)) return {issues:o.issues}; }catch(e){} }
  const am=content.match(/\[[\s\S]*\]/);
  if(am){ try{ return {issues:JSON.parse(am[0])}; }catch(e){} }
  return {issues:[]};
}
function resizeImageForAPI(dataUrl){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height; const max=1024;
      if(w>max||h>max){ const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/jpeg',0.82));
    };
    img.onerror=()=>reject(new Error('图片解码失败'));
    img.src=dataUrl;
  });
}
function videoFrame(file){
  return new Promise((resolve)=>{
    const v=document.createElement('video'); v.preload='metadata'; v.muted=true;
    try{ v.src=URL.createObjectURL(file); }catch(e){ resolve(null); return; }
    v.onloadeddata=()=>{ try{ v.currentTime=Math.min(1,(v.duration||2)/2); }catch(e){ resolve(null); } };
    v.onseeked=()=>{ try{ const c=document.createElement('canvas'); c.width=v.videoWidth||640; c.height=v.videoHeight||480; c.getContext('2d').drawImage(v,0,0,c.width,c.height); resolve(c.toDataURL('image/jpeg',0.7)); }catch(e){ resolve(null);} };
    v.onerror=()=>resolve(null);
    setTimeout(()=>resolve(null), 8000);
  });
}
function toast(msg,ms=2200){ let t=document.getElementById('toast'); if(!t){ t=document.createElement('div'); t.id='toast'; t.style.cssText='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:9999;max-width:82%;text-align:center;opacity:0;transition:opacity .2s;pointer-events:none'; document.body.appendChild(t);} t.textContent=msg; t.style.opacity='1'; clearTimeout(t._t); t._t=setTimeout(()=>{t.style.opacity='0';}, ms); }

    </div>
    <div style="color:var(--ink-2);font-size:18px">›</div>
  </div>`
  + prepSec('办证 / 物业手续清单','docs','📋')

  return tl + prepBlock + S.stages.map((s,i)=>{
    const done=s.tasks.filter(t=>t.done).length;

    const open = s.open?'open':'';
    const metaHtml = `

        <div class="txt">${esc(t.text)}</div>
      </div>`).join('');
    const guideHtml = s.guide.map(g=>`<li>${esc(g)}</li>`).join('');
    const mats = STAGE_MATS[s.id]||[];

    const matsHtml = mats.length?`
      <div class="guide" style="background:#fff6ef">

    return `

function renderBudget(){

  const cats = S.budget.map(b=>{
    const p = b.budget? (b.spent/b.budget*100):0;
    const isOver = b.spent>b.budget;
    const recent = b.expenses.slice(-3).reverse().map(e=>`<div style="display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);padding:3px 0;border-bottom:1px dashed var(--line)"><span>${esc(e.note||'支出')}</span><span>${fmt(e.amount)}</span></div>`).join('');

function copyContract(){
  const txt=contractPlainText();
  const ok=()=>{ const b=document.querySelector('#contractModal .btn'); const o=b.textContent; b.textContent='✓ 已复制'; setTimeout(()=>b.textContent=o,1500); };
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(ok).catch(()=>fallbackCopy(txt,ok)); }
  else fallbackCopy(txt,ok);
}
function fallbackCopy(txt,ok){
  const ta=document.createElement('textarea'); ta.value=txt; ta.style.cssText='position:fixed;opacity:0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); ok(); }catch(e){ alert('复制失败，请长按文本手动选择复制'); }
  ta.remove();
}

let priceQ='';
function priceStats(list){
  let saving=0, comparing=0, orderedN=0, orderedSum=0;
  (list||S.purchases).forEach(p=>{
    const ps=p.quotes.map(q=>q.price);
    if(ps.length>1) saving+=Math.max(...ps)-Math.min(...ps);
    if(p.ordered){orderedN++;orderedSum+=p.ordered.price;}
    else if(p.quotes.length) comparing++;
  });
  return {saving,comparing,orderedN,orderedSum};
}

function priceCard(p){
  const ps=p.quotes.map(q=>q.price);
  const min=ps.length?Math.min(...ps):null;
  const max=ps.length?Math.max(...ps):null;
  let chip,bg;
  if(p.ordered){chip='已下单';bg='var(--green-soft)';}
  else if(ps.length){chip='比价中';bg='var(--blue-soft)';}
  else {chip='待报价';bg='var(--bg)';}
  const rows=[...p.quotes].sort((a,b)=>a.price-b.price).map(q=>{
    const isMin=!p.ordered&&q.price===min;
    return `<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line)">
      <div style="flex:1;font-size:13px">${esc(q.channel)}${isMin?' <span style="color:var(--green);font-weight:700;font-size:11px">最低</span>':''}${q.note?`<div style="font-size:11px;color:var(--ink-2)">${esc(q.note)}</div>`:''}</div>
      <div style="font-weight:700;font-size:14px;color:${isMin?'var(--green)':'var(--ink)'}">¥${Math.round(q.price).toLocaleString()}</div>
      <div style="color:var(--ink-2);cursor:pointer;padding:2px 6px" onclick="delQuote('${p.id}','${q.id}')">✕</div>
    </div>`;}).join('');
  let diff='';
  if(ps.length>1) diff=`<div style="font-size:12px;margin-top:6px;color:var(--ink-2)">高低价差 <b style="color:var(--amber)">¥${Math.round(max-min).toLocaleString()}</b>，选最低价 vs 最高价省 <b style="color:var(--green)">¥${Math.round(max-min).toLocaleString()}</b></div>`;
  let budgetTip='';
  if(min!=null&&p.budget>0){
    budgetTip = min<=p.budget
      ? `<div style="font-size:12px;color:var(--green);margin-top:3px">✓ 最低价低于预算 ¥${Math.round(p.budget-min).toLocaleString()}</div>`
      : `<div style="font-size:12px;color:var(--red);margin-top:3px">⚠ 最低价超预算 ¥${Math.round(min-p.budget).toLocaleString()}</div>`;
  }
  let orderBox='';
  if(p.ordered){
    orderBox=`<div style="margin-top:8px;background:var(--green-soft);border-radius:10px;padding:8px 10px;font-size:13px">
      🛒 已下单：<b>${esc(p.ordered.channel)}</b> <b style="color:var(--green)">¥${Math.round(p.ordered.price).toLocaleString()}</b>
      <span style="color:var(--ink-2);font-size:11px"> · ${esc(p.ordered.date||'')}</span>
      ${p.ordered.rec?'<div style="font-size:11px;color:var(--ink-2);margin-top:2px">已记入预算支出</div>':`<button class="btn ghost" style="margin-top:6px;padding:5px 12px;font-size:12px" onclick="orderToBudget('${p.id}')">记入预算支出</button>`}
    </div>`;
  }
  return `
  <div class="card">
    <div style="display:flex;align-items:flex-start;gap:8px">
      <div style="flex:1">
        <span style="font-size:11px;background:${bg};color:var(--ink-2);border-radius:6px;padding:2px 8px;margin-right:6px">${chip}</span>
        <span style="font-size:11px;color:var(--ink-2);background:var(--bg);border-radius:6px;padding:2px 8px">${esc(p.cat||'未分类')}</span>
        <div style="font-weight:700;font-size:15px;margin-top:6px">${esc(p.name)}</div>
        ${platChips(p.id)}
        <div style="font-size:11px;color:var(--ink-2);margin-top:5px">💡 点平台直达搜索价 → 看准最低价回这里点「＋ 报价」填回</div>
        ${p.budget>0?`<div style="font-size:12px;color:var(--ink-2);margin-top:2px">预算 ${fmt(p.budget)}${min!=null?' · 最低 '+fmt(min):''}</div>`:(min!=null?`<div style="font-size:12px;color:var(--ink-2);margin-top:2px">最低 ${fmt(min)}</div>`:'')}
      </div>
      <div style="color:var(--ink-2);cursor:pointer;padding:2px 4px" onclick="delProduct('${p.id}')">🗑</div>
    </div>
    ${rows||'<div style="font-size:12px;color:var(--ink-2);padding:8px 0">还没有报价，点下方「＋ 报价」录入第一个渠道</div>'}
    ${diff}${budgetTip}${orderBox}
    <div style="display:flex;gap:8px;margin-top:10px">
      <button class="btn" style="flex:1;padding:8px 0;font-size:13px" onclick="addQuote('${p.id}')">＋ 报价</button>
      <button class="btn ghost" style="flex:1;padding:8px 0;font-size:13px" onclick="editProduct('${p.id}')">✎ 编辑</button>
      ${p.ordered
        ?`<button class="btn ghost" style="flex:1;padding:8px 0;font-size:13px" onclick="cancelOrder('${p.id}')">取消下单</button>`

function addPrepPhoto(type,id){
  const x = S.prep[type].find(y=>y.id===id);
  const ta = document.getElementById('pp_note'); if(ta) x.note = ta.value; // 暂存备注，避免重渲染丢失
  if(!x.photos) x.photos=[];
  const files = document.getElementById('pp_file').files;
  if(!files.length){ editPrepItem(type,id); return; }
  let pending = files.length;
  for(const f of files){
    resizeImage(f, 640, 0.7, url=>{
      x.photos.push(url); save();
      if(--pending===0) editPrepItem(type,id);
    });
  }
}
function delPrepPhoto(type,id,i){
  const x = S.prep[type].find(y=>y.id===id);
  x.photos.splice(i,1); save(); editPrepItem(type,id);
}

  const x = S.prep[type].find(y=>y.id===id);
  const ta = document.getElementById('pp_note'); if(ta) x.note = ta.value.trim();
  save(); closeSheet(); render();

function resizeImage(file,maxW,q,cb){
  const r=new FileReader();
  r.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      let w=img.width,h=img.height;
      if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',q));
    };
    img.src=e.target.result;
  };
  r.readAsDataURL(file);
}
function zoomPhoto(src){
  const url=decodeURIComponent(src);
  const m=document.createElement('div');
  m.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;display:flex;align-items:center;justify-content:center;padding:20px';
  m.onclick=()=>m.remove();
  const im=document.createElement('img'); im.src=url; im.style.cssText='max-width:100%;max-height:100%;border-radius:10px';
  m.appendChild(im); document.body.appendChild(m);
}

/* --- 画布（手绘草图） --- */
let SK=null;
function initSketch(rid){
  const cv=document.getElementById('sketchCv'); if(!cv) return;
  const r=S.design.rooms.find(x=>x.id===rid); if(!r) return;
  const ctx=cv.getContext('2d');
  SK={cv,ctx,rid,strokes:[],cur:null,color:'#8B6F47',size:4,erase:false};
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(r.sketch){ const im=new Image(); im.onload=()=>ctx.drawImage(im,0,0,cv.width,cv.height); im.src=r.sketch; }
  const pos=e=>{const t=cv.getBoundingClientRect();return{x:(e.clientX-t.left)*cv.width/t.width,y:(e.clientY-t.top)*cv.height/t.height};};
  const start=e=>{ if(e.button&&e.button!==0) return; e.preventDefault();
    SK.cur={color:SK.erase?'#ffffff':SK.color,size:SK.erase?20:SK.size,pts:[pos(e)]};
    cv.setPointerCapture&&cv.setPointerCapture(e.pointerId); };
  const move=e=>{ if(!SK||!SK.cur) return; e.preventDefault();
    const p=pos(e), c=SK.cur, last=c.pts[c.pts.length-1];
    c.pts.push(p);
    SK.ctx.strokeStyle=c.color; SK.ctx.lineWidth=c.size;
    SK.ctx.beginPath(); SK.ctx.moveTo(last.x,last.y); SK.ctx.lineTo(p.x,p.y); SK.ctx.stroke(); };
  const end=()=>{ if(!SK||!SK.cur) return; if(SK.cur.pts.length>1) SK.strokes.push(SK.cur); SK.cur=null; };
  cv.onpointerdown=start; cv.onpointermove=move; window.onpointerup=end;
}
function skRedraw(){
  if(!SK) return; const c=SK.ctx;
  c.fillStyle='#fff'; c.fillRect(0,0,SK.cv.width,SK.cv.height);
  SK.strokes.forEach(st=>{ c.strokeStyle=st.color; c.lineWidth=st.size; c.beginPath();
    st.pts.forEach((p,i)=>i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y)); c.stroke(); });
}
function skPick(el){ if(!SK) return; SK.color=el.dataset.c; SK.erase=false;
  document.querySelectorAll('.sk-dot').forEach(b=>b.classList.remove('on')); el.classList.add('on');
  document.getElementById('skErase').classList.remove('on'); }
function skEraseToggle(){ if(!SK) return; SK.erase=!SK.erase;
  document.getElementById('skErase').classList.toggle('on',SK.erase); }
function skSize(el){ if(!SK) return; SK.size=+el.dataset.s;
  document.querySelectorAll('[data-s]').forEach(b=>b.classList.remove('on')); el.classList.add('on'); }
function skUndo(){ if(!SK) return; SK.strokes.pop(); skRedraw(); }
function skClear(){ if(!SK) return; if(SK.strokes.length&&!confirm('清空当前画布（含本次未保存的全部笔画）？')) return;
  SK.strokes=[]; skRedraw(); }
function skSave(rid){
  if(!SK) return;
  const t=document.createElement('canvas'); t.width=SK.cv.width; t.height=SK.cv.height;
  const c=t.getContext('2d'); c.fillStyle='#fff'; c.fillRect(0,0,t.width,t.height); c.drawImage(SK.cv,0,0);
  const r=S.design.rooms.find(x=>x.id===rid); if(!r) return;
  r.sketch=t.toDataURL('image/jpeg',0.72);
  try{ save(); }catch(e){ alert('本地存储空间不足，草图未能保存（可删除部分案例/照片后重试）'); return; }
  const b=document.getElementById('skSaveBtn'); if(b){ b.textContent='✓ 已保存'; setTimeout(()=>{b.textContent='💾 保存草图';},1500); }
}

}
function saveRoomNote(rid,v){ const r=S.design.rooms.find(x=>x.id===rid); r.note=v; save(); }
function addRoomTodo(rid){
  const i=document.getElementById('roomTodoIn'); const v=(i.value||'').trim(); if(!v) return;
  const r=S.design.rooms.find(x=>x.id===rid); r.todos.push({id:uid(),text:v,done:false});
  save(); render();
}
function toggleRoomTodo(rid,tid){ const r=S.design.rooms.find(x=>x.id===rid);
  const t=r.todos.find(x=>x.id===tid); t.done=!t.done; save(); render(); }
function delRoomTodo(rid,tid){ const r=S.design.rooms.find(x=>x.id===rid);
  r.todos=r.todos.filter(x=>x.id!==tid); save(); render(); }
function saveRoomBudget(rid,v){ const r=S.design.rooms.find(x=>x.id===rid);
  r.budget=v.replace(/[^\d.]/g,''); save(); render(); }

/* ============ 交互 ============ */
function toggleStage(id){ const s=S.stages.find(x=>x.id===id); s.open=!s.open; save(); render(); }
function toggleTask(sid,tid){
  const s=S.stages.find(x=>x.id===sid); const t=s.tasks.find(x=>x.id===tid);
  t.done=!t.done; save(); render();
}
function toggleTodo(id){ const t=S.todos.find(x=>x.id===id); t.done=!t.done; save(); render(); }
function toggleMat(sid,i){ const k=sid+':'+i; S.matDone[k]=!S.matDone[k]; save(); render(); }
function delTodo(id){ S.todos=S.todos.filter(x=>x.id!==id); save(); render(); }

/* 弹窗 */
function openSheet(html){ document.getElementById('sheet').innerHTML=html; document.getElementById('mask').classList.add('show'); }
function closeSheet(){ document.getElementById('mask').classList.remove('show'); }

/* 预算：记一笔 */
function addExpense(){
  const opts = S.budget.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('');
  openSheet(`
    <h4>＋ 记一笔支出</h4>
    <div class="field"><label>类别</label><select id="ex_cat">${opts}</select></div>
    <div class="field"><label>金额（元）</label><input id="ex_amt" type="number" inputmode="decimal" placeholder="如 3500"></div>
    <div class="field"><label>备注（选填）</label><input id="ex_note" placeholder="如 客厅地砖"></div>
    <div class="row">
      <button class="btn cancel" onclick="closeSheet()">取消</button>
      <button class="btn" onclick="submitExpense()">保存</button>
    </div>`);
}
function submitExpense(){
  const cat=document.getElementById('ex_cat').value;
  const amt=parseFloat(document.getElementById('ex_amt').value);
  const note=document.getElementById('ex_note').value.trim();
  if(!amt||amt<=0){ alert('请输入有效金额'); return; }
  const b=S.budget.find(x=>x.id===cat);
  b.spent += amt;
  b.expenses.push({id:uid(),amount:amt,note,date:today()});
  save(); closeSheet(); render();
}
function editBudget(id){
  const b=S.budget.find(x=>x.id===id);
  openSheet(`
    <h4>修改「${esc(b.name)}」预算额度</h4>
    <div class="field"><label>预算金额（元）</label><input id="bd_val" type="number" inputmode="decimal" value="${b.budget}"></div>
    <div class="row">
      <button class="btn cancel" onclick="closeSheet()">取消</button>
      <button class="btn" onclick="submitBudget('${id}')">保存</button>
    </div>`);
}
function submitBudget(id){
  const v=parseFloat(document.getElementById('bd_val').value);
  if(!v||v<=0){ alert('请输入有效金额'); return; }
  S.budget.find(x=>x.id===id).budget=v; save(); closeSheet(); render();
}

/* 待办：新增/编辑 */
function editTodo(id){
  const t = id? S.todos.find(x=>x.id===id):null;
  const pr = t? t.priority:'mid';
  openSheet(`
    <h4>${id?'编辑待办':'添加待办'}</h4>
    <div class="field"><label>事项</label><textarea id="td_text" placeholder="如 选购主卫瓷砖">${t?esc(t.text):''}</textarea></div>
    <div class="field"><label>优先级</label>
      <div class="seg" id="td_seg">
        <button data-v="high" class="${pr==='high'?'on':''}">高</button>
        <button data-v="mid" class="${pr==='mid'?'on':''}">中</button>
        <button data-v="low" class="${pr==='low'?'on':''}">低</button>
      </div>
    </div>
    <div class="field"><label>截止日期（选填）</label><input id="td_date" type="date" value="${t?t.deadline:''}"></div>
    <div class="row">
      <button class="btn cancel" onclick="closeSheet()">取消</button>
      ${id?`<button class="btn ghost" onclick="delTodo('${id}');closeSheet()">删除</button>`:''}
      <button class="btn" onclick="submitTodo('${id||''}')">保存</button>
    </div>`);
  document.querySelectorAll('#td_seg button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#td_seg button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
  });
}
function submitTodo(id){
  const text=document.getElementById('td_text').value.trim();
  const pr=document.querySelector('#td_seg button.on').dataset.v;
  const date=document.getElementById('td_date').value;
  if(!text){ alert('请输入事项内容'); return; }
  if(id){ Object.assign(S.todos.find(x=>x.id===id),{text,priority:pr,deadline:date}); }
  else S.todos.push({id:uid(),text,priority:pr,deadline:date,done:false});
  save(); closeSheet(); render();
}

function resetAll(){
  if(confirm('确定要清空所有数据并恢复初始示例吗？此操作不可撤销。')){
    S=seed(); save(); render();
  }
}

/* 启动 */
render();
</script>
</body>
</html>
